; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter =
	+<*>
	-<test/>
lib_deps = 
	thijse/ArduinoLog@^1.1.1
	adafruit/Adafruit ADS1X15@^2.4.0
	SPI
	adafruit/Adafruit LSM6DS@^4.7.3
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/RTClib@^2.1.4
build_flags = -I include

[env:sd_card_test]
extends = env:esp32dev
build_src_filter =
	-<*>
	+<test/sd_card_test.cpp>

[env:telemetry_test]
extends = env:esp32dev
build_src_filter =
	-<*>
	+<test/telemetry_test.cpp>

[env:i2c_scan_test]
extends = env:esp32dev
build_src_filter =
	-<*>
	+<test/i2c_scan_test.cpp>

[env:rtc_test]
extends = env:esp32dev
build_src_filter =
	-<*>
	+<test/rtc_test.cpp>

[env:can_transceiver_test]
extends = env:esp32dev
build_src_filter =
	-<*>
	+<test/can_transceiver_test.cpp>

[env:can_internal_loopback_test]
extends = env:esp32dev
build_src_filter =
	-<*>
	+<test/can_internal_loopback_test.cpp>
